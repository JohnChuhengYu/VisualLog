name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            artifact_pattern: build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            artifact_pattern: build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            task: packageDeb
            artifact_pattern: build/compose/binaries/main/deb/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'
          cache: 'gradle'

      - name: Setup WiX Toolset v3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixDir = "$env:RUNNER_TEMP\wix3"
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$env:RUNNER_TEMP\wix3.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wix3.zip" -DestinationPath $wixDir
          Remove-Item "$env:RUNNER_TEMP\wix3.zip"
          echo $wixDir >> $env:GITHUB_PATH

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Package Desktop App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat ${{ matrix.task }} --info --stacktrace

      - name: Package Desktop App (macOS & Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew ${{ matrix.task }} --info --stacktrace

      - name: Inspect generated artifacts
        shell: bash
        run: |
          echo "=== Content of build/compose/binaries/main ==="
          ls -R build/compose/binaries/main/ || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: VisualLog ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

